      if (Array.isArray(saved.hidden)) state.hidden = saved.hidden.filter(x => Number.isInteger(x) && x >= 0 && x < 9);
    }
    applySaved(window.openai && window.openai.widgetState && window.openai.widgetState.privateContent);
    function save() {
      if (!window.openai || !window.openai.setWidgetState) return;
      const privateContent = { version: 1, activity: state.activity, group: state.group, hidden: state.hidden };
      const modelContent = {
        period: "2026-08-01至2026-10-22",
        activity: state.activity === "active" ? "活跃" : "不活跃",
        group: state.group === "non" ? "非回血（8/1—3未拆分参考）" : "回血",
        visibleSegments: currentSegments().filter(s => !state.hidden.includes(s.id)).map(s => s.label),
        field: "人均被分发给几个人"

    }
    window.addEventListener("openai:set_globals", event => {
      const saved = event.detail && event.detail.globals && event.detail.globals.widgetState;
      if (saved && saved.privateContent) { applySaved(saved.privateContent); render(false); }
    });
    function currentSegments() {
      if (state.group === "non") return data.segments;
      return data.segments.filter(s => data.matrix[state.activity].recovery[s.id].some(p => p !== null));
    }
    function points(id) {
      return data.matrix[state.activity][state.group][id].map((r, i) => ({
        x: dateObjects[i], day: data.dates[i], y: r && r[1] > 0 ? r[0] : null,
        raw: r, uv: r ? r[1] : null, row: r ? r[2] : null, reference: !!(r && r[3])

    }
    function swatch(id) {

    }
    function hideTooltip() {

    }
    function renderLegend(segments) {

      segments.forEach(segment => {
        const button = document.createElement("button");

        button.className = "cursor-interaction";
        button.dataset.segmentId = String(segment.id);
        button.setAttribute("aria-pressed", String(!state.hidden.includes(segment.id)));
        button.setAttribute("aria-label", "总览：" + segment.label + "，点击显示或隐藏");
        button.appendChild(swatch(segment.id));
        button.appendChild(document.createTextNode(segment.label));
        button.addEventListener("click", () => {
          if (state.hidden.includes(segment.id)) state.hidden = state.hidden.filter(id => id !== segment.id);
          else state.hidden = state.hidden.concat(segment.id);
          hideTooltip();
          render(true);
          const replacement = legend.querySelector('button[data-segment-id="' + segment.id + '"]');
          if (replacement) replacement.focus();
          live.textContent = "总览显示 " + segments.filter(s => !state.hidden.includes(s.id)).length + " 个分层；明细保留全部分层。";
          save();
        });
        legend.appendChild(button);
      });
    }
    function interpolate(points, target) {
      const index = d3.bisector(d => d.x).center(points, target);
      const nearest = points[index];
      if (+target === +nearest.x) return nearest.y;
      const rightIndex = d3.bisector(d => d.x).left(points, target);
      if (rightIndex <= 0 || rightIndex >= points.length) return nearest.y;
      const a = points[rightIndex - 1], b = points[rightIndex];
      if (a.y === null || b.y === null || a.reference !== b.reference) return null;
      return a.y + (b.y - a.y) * ((+target - +a.x) / (+b.x - +a.x));
    }
    function tickValues(width, compact) {
      const dates = ["2026-08-01", "2026-08-15", "2026-09-01", "2026-09-15", "2026-10-01", "2026-10-15", "2026-10-22"];
      const short = ["2026-08-01", "2026-09-01", "2026-10-01", "2026-10-22"];
      return (width < 440 || compact ? short : dates).map(d => d3.utcParse("%Y-%m-%d")(d));
    }
    function fitLabels(svg) {
      const nodes = svg.selectAll(".x-axis .tick text").nodes();

      nodes.forEach((node, i) => {
        d3.select(node).attr("text-anchor", i === 0 ? "start" : i === nodes.length - 1 ? "end" : "middle");

    }
    function plot(container, segments, compact, chartKey, animate) {
      const width = container.clientWidth;

      const height = compact ? 220 : width < 440 ? 300 : 360;
      const frame = { left: 64, right: width - 15, top: 27, bottom: height - 54 };
      const visible = segments.filter(s => chartKey !== "overview" || !state.hidden.includes(s.id));
      const allSeries = visible.map(s => ({ ...s, values: points(s.id) }));

      const upper = extent[1] === undefined ? 1 : extent[1] === 0 ? 1 : extent[1] * 1.09;
      const x = d3.scaleUtc().domain(d3.extent(dateObjects)).range([frame.left + 3, frame.right - 3]);

      svg.append("title").text((compact ? segments[0].label : "分层总览") + " · 人均被分发给几个人");
      svg.append("desc").text("纵轴为人数，横轴为日期。8月1日至3日未拆分回血，仅在非回血视图用参考虚线展示；8月4日起展示所选组别。");
      const clipId = root.id + "-clip-" + chartKey;
      svg.append("defs").append("clipPath").attr("id", clipId).append("rect")

      svg.append("rect").attr("data-chart-frame", "")
        .attr("x", frame.left).attr("y", frame.top).attr("width", frame.right - frame.left).attr("height", frame.bottom - frame.top)
        .attr("fill", "none").attr("stroke", "var(--border)").attr("stroke-width", 1);
      svg.append("rect").attr("x", frame.left).attr("y", frame.top)
        .attr("width", x(d3.utcParse("%Y-%m-%d")("2026-08-04")) - frame.left)
        .attr("height", frame.bottom - frame.top).attr("fill", "var(--muted)").attr("opacity", .55);
      svg.append("g").attr("class", "grid").attr("transform", "translate(" + frame.left + ",0)")
        .call(d3.axisLeft(y).ticks(4).tickSize(-(frame.right - frame.left)).tickFormat(""));
      svg.append("g").attr("class", "y-axis").attr("transform", "translate(" + frame.left + ",0)")
        .call(d3.axisLeft(y).ticks(4).tickSize(0).tickPadding(8).tickFormat(v => upper < 6 ? d3.format(".1f")(v) : d3.format(",.0f")(v)));
      svg.append("g").attr("class", "x-axis").attr("transform", "translate(0," + frame.bottom + ")")
        .call(d3.axisBottom(x).tickValues(tickValues(width, compact)).tickFormat(dateFormat).tickSize(0).tickPadding(9));
      svg.append("text").attr("class", "axis-title").attr("data-axis", "x")
        .attr("x", (frame.left + frame.right) / 2).attr("y", height - 6).attr("text-anchor", "middle").text("日期");
      svg.append("text").attr("class", "axis-title").attr("data-axis", "y")
        .attr("transform", "translate(14," + (frame.top + frame.bottom) / 2 + ") rotate(-90)")
        .attr("text-anchor", "middle").text("人均分发（人）");
      ["2026-09-25", "2026-10-16"].forEach(day => {
        const px = x(d3.utcParse("%Y-%m-%d")(day));
        svg.append("line").attr("x1", px).attr("x2", px).attr("y1", frame.top).attr("y2", frame.bottom)
          .attr("stroke", "var(--muted-foreground)").attr("stroke-opacity", .5).attr("stroke-width", 1).attr("stroke-dasharray", "3 4");
        svg.append("text").attr("x", px).attr("y", frame.top - 9).attr("text-anchor", "middle").text(day.slice(5).replace("-", "/"));
      });
      const traces = svg.append("g").attr("clip-path", "url(#" + clipId + ")");
      allSeries.forEach(series => {
        [false, true].forEach(reference => {
          const line = d3.line().defined(p => p.y !== null && p.reference === reference).x(p => x(p.x)).y(p => y(p.y));
          const pathText = line(series.values);
          if (!pathText) return;
          const pathKey = chartKey + "-" + series.id + "-" + reference;
          const old = oldPaths.get(pathKey);
          const path = traces.append("path").attr("data-series-id", series.id).attr("data-reference", String(reference))
            .attr("fill", "none").attr("stroke", color(series.id)).attr("stroke-width", compact ? 2 : 2.1)
            .attr("stroke-linecap", "round").attr("stroke-linejoin", "round")
            .attr("stroke-opacity", reference ? .58 : 1).attr("stroke-dasharray", reference ? "3 3" : dashIndex[series.id] || null);
          const sameShape = old && old.replace(/[-+]?\d*\.?\d+(?:e[-+]?\d+)?/gi, "#") === pathText.replace(/[-+]?\d*\.?\d+(?:e[-+]?\d+)?/gi, "#");
          if (animate && !reduceMotion && sameShape) path.attr("d", old).transition().duration(180).attr("d", pathText);
          else path.attr("d", pathText);
          oldPaths.set(pathKey, pathText);
        });
        series.values.forEach((p, i, values) => {
          if (p.y === null) return;

          if ((!prev || prev.y === null || prev.reference !== p.reference) && (!next || next.y === null || next.reference !== p.reference)) {
            traces.append("circle").attr("data-series-id", series.id).attr("data-isolated-observation", p.day)
              .attr("cx", x(p.x)).attr("cy", y(p.y)).attr("r", 2.7).attr("fill", color(series.id));
          }
        });
      });
      const validCount = allSeries.reduce((total, s) => total + s.values.filter(p => p.y !== null).length, 0);
      if (!visible.length || !validCount) {
        const raw = segments.length === 1 ? points(segments[0].id) : [];
        const exists = raw.some(p => p.raw);
        svg.append("text").attr("data-empty-message", "").attr("x", (frame.left + frame.right) / 2).attr("y", (frame.top + frame.bottom) / 2)
          .attr("text-anchor", "middle").text(!visible.length ? "点击图例显示分层" : exists ? "被分发 UV 为 0，无有效样本" : "源表未提供此分层记录");
      }
      const guide = traces.append("line").attr("data-chart-hover-guide", "")
        .attr("y1", frame.top).attr("y2", frame.bottom).attr("stroke", "var(--foreground)")
        .attr("stroke-width", 1).attr("stroke-opacity", .5).attr("visibility", "hidden");
      const markers = traces.append("g");
      allSeries.forEach(series => markers.append("circle").attr("data-chart-hover-marker", series.id).attr("r", 3.5)
        .attr("fill", color(series.id)).attr("visibility", "hidden"));
      const overlay = svg.append("rect").attr("data-chart-hit", "").attr("data-chart-hover-overlay", "cross-series")

        .attr("fill", "transparent").attr("class", "cursor-interaction");
      function show(event) {
        const px = Math.max(x.range()[0], Math.min(x.range()[1], d3.pointer(event, svg.node())[0]));
        const target = x.invert(px);
        const nearestIndex = d3.bisector(d => d).center(dateObjects, target);
        const nearestDay = data.dates[nearestIndex];
        root.querySelectorAll("[data-chart-hover-guide], [data-chart-hover-marker]").forEach(el => el.setAttribute("visibility", "hidden"));
        guide.attr("x1", px).attr("x2", px).attr("visibility", "visible");
        tooltip.replaceChildren();
        const title = document.createElement("div");
        title.className = "tip-title";
        title.textContent = (pinned ? "已固定 · " : "") + clockFormat(target);
        tooltip.appendChild(title);
        const header = document.createElement("div");
        header.className = "tip-row text-small";
        ["分层", "游标估值", dateFormat(dateObjects[nearestIndex]) + " 原值"].forEach(t => { const cell = document.createElement("span"); cell.textContent = t; header.appendChild(cell); });
        tooltip.appendChild(header);
        allSeries.forEach(series => {
          const nearest = series.values[nearestIndex];
          const v = interpolate(series.values, target);
          markers.select('[data-chart-hover-marker="' + series.id + '"]').attr("cx", px).attr("cy", v === null ? frame.bottom : y(v)).attr("visibility", v === null ? "hidden" : "visible");
          const row = document.createElement("div"); row.className = "tip-row";
          const label = document.createElement("span"); label.className = "tip-name"; label.appendChild(swatch(series.id)); label.appendChild(document.createTextNode(series.label));
          const cursorValue = document.createElement("span"); cursorValue.className = "tip-num"; cursorValue.textContent = v === null ? "—" : numberFormat(v);
          const actualValue = document.createElement("span"); actualValue.className = "tip-num";
          actualValue.textContent = nearest.y === null ? nearest.raw ? "无分发样本" : "缺记录" : numberFormat(nearest.y) + (nearest.reference ? "¹" : "");
          row.append(label, cursorValue, actualValue); tooltip.appendChild(row);
          if (compact) {
            const detail = document.createElement("div"); detail.className = "tip-detail text-small";
            detail.textContent = nearest.raw ? "原表第 " + nearest.row + " 行 · 被分发 UV " + nearest.uv + (nearest.uv === 0 ? " · 原表指标值 " + nearest.raw[0] + "（无样本）" : "") : "该日期源表无此分层记录";
            tooltip.appendChild(detail);

        const note = document.createElement("div"); note.className = "tip-detail text-small";
        note.textContent = "原字段：人均被分发给几个人（" + (state.activity === "active" ? "活跃表 F 列" : "不活跃表 D 列") + "）。游标估值为相邻日线性位置；原值取最近日，不跨空档。";
        tooltip.appendChild(note);

        }

        const svgBox = svg.node().getBoundingClientRect(), rootBox = root.getBoundingClientRect();

      overlay.on("pointermove", event => { if (!pinned) show(event); })
        .on("pointerleave", () => { if (!pinned) { tooltip.style.display = "none"; guide.attr("visibility", "hidden"); markers.selectAll("circle").attr("visibility", "hidden"); } })
        .on("click", event => { pinned = !pinned; if (pinned) show(event); else hideTooltip(); });

    }
    function render(animate) {

      groupSelect.value = state.group;
      root.querySelector("#fanout-definition-20261026").textContent = "原表字段：人均被分发给几个人 · " + (state.activity === "active" ? "活跃表 F 列" : "不活跃表 D 列") + " · 单位：人";
      root.querySelector("#fanout-boundary-20261026").textContent = state.group === "non" ? "8/1—3 未拆分回血，以参考虚线显示；8/4 起为非回血，口径切换处断开。" : "回血分层从 8/4 起出现；仅展示源表出现的分层，无样本和缺失日期留空。";
      const segments = currentSegments();

      plot(overview, segments, false, "overview", animate);
      facets.replaceChildren();
      segments.forEach(segment => {

        const last = document.createElement("span"); last.className = "last text-small tabular-nums";

        caption.append(name, last);
        const container = document.createElement("div"); container.className = "plot";
        figure.append(caption, container); facets.appendChild(figure);

      state.activity = activitySelect.value; hideTooltip(); render(true); save();
      live.textContent = "已切换到" + (state.activity === "active" ? "活跃" : "不活跃") + "用户。";
    });

      state.group = groupSelect.value; hideTooltip(); render(true); save();

  })();
