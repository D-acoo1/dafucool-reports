<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>测试报告 2 · 绿色版</title>
<style>
  body {
    margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    min-height: 100vh; color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: rgba(255,255,255,0.15); backdrop-filter: blur(20px);
    border-radius: 24px; padding: 44px 52px; max-width: 640px; width: 100%;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    background: rgba(255,255,255,0.2); font-size: 12px; letter-spacing: 1px;
    margin-bottom: 12px;
  }
  h1 { margin: 0 0 8px; font-size: 30px; }
  .sub { font-size: 14px; opacity: 0.85; margin-bottom: 28px; }

  .donut-wrap { display: flex; align-items: center; gap: 32px; margin: 24px 0 28px; }
  .donut {
    width: 140px; height: 140px; flex-shrink: 0;
    border-radius: 50%;
    background: conic-gradient(#fff 0% 68%, rgba(255,255,255,0.25) 68% 100%);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .donut::after {
    content: ''; width: 95px; height: 95px; border-radius: 50%;
    background: rgba(17,153,142,0.6); position: absolute;
  }
  .donut-label {
    position: relative; z-index: 1; text-align: center;
  }
  .donut-label .big { font-size: 30px; font-weight: 800; line-height: 1; }
  .donut-label .small { font-size: 11px; opacity: 0.85; margin-top: 4px; }
  .donut-info { flex: 1; }
  .donut-info h3 { margin: 0 0 6px; font-size: 16px; }
  .donut-info p { margin: 0; font-size: 13px; opacity: 0.85; line-height: 1.6; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
  .tag {
    padding: 6px 14px; background: rgba(255,255,255,0.15);
    border-radius: 20px; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .footer {
    margin-top: 28px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.2);
    font-size: 13px; opacity: 0.88; line-height: 1.6;
  }
  .footer b { color: #fff; background: rgba(255,255,255,0.15); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">🧪 TEST REPORT #2</div>
  <h1>测试报告（绿色版）</h1>
  <div class="sub">用来验证云端一键删除功能</div>

  <div class="donut-wrap">
    <div class="donut">
      <div class="donut-label">
        <div class="big">68%</div>
        <div class="small">完成度</div>
      </div>
    </div>
    <div class="donut-info">
      <h3>项目进度良好</h3>
      <p>本周完成了 3/5 个关键里程碑，整体进度符合预期。剩余任务预计下周内完成。</p>
    </div>
  </div>

  <div class="tags">
    <div class="tag">✅ 需求确认</div>
    <div class="tag">✅ 原型设计</div>
    <div class="tag">✅ 开发中</div>
    <div class="tag">⏳ 测试</div>
    <div class="tag">⏳ 发布</div>
  </div>

  <div class="footer">
    <b>删除测试步骤</b>：在云端目录页找到这份"测试报告 2"，鼠标悬停右边会出现 🗑 按钮，
    点它 → 确认删除 → 报告应从列表里立即消失，30 秒后 GitHub 仓库里也看不到。
  </div>
</div>
</body>
</html>
