<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>覆盖测试报告 · v5</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  body {
    margin:0; min-height:100vh;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    background: #0a0a1a;
    background-image:
      linear-gradient(#0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,0,128,0.03) 2px, rgba(255,0,128,0.03) 4px);
    color:#0ff; display:flex; align-items:center; justify-content:center; padding:40px 20px;
    overflow:hidden; position:relative;
  }
  /* 扫描线效果 */
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:10;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
  }
  .card {
    background: #000; padding: 40px 48px; max-width: 600px; width: 100%;
    border: 4px solid #0ff;
    box-shadow:
      0 0 0 4px #000,
      0 0 0 8px #ff00ff,
      0 0 40px rgba(0,255,255,0.5),
      inset 0 0 20px rgba(0,255,255,0.1);
    text-align: center;
    position: relative;
  }
  .version {
    color: #ff00ff; font-size: 10px; letter-spacing: 3px;
    margin-bottom: 16px; line-height: 1.8;
    text-shadow: 0 0 10px #ff00ff;
  }
  h1 {
    margin: 0 0 12px; font-size: 16px; color: #0ff; line-height: 1.6;
    text-shadow: 0 0 15px #0ff, 0 0 30px rgba(0,255,255,0.5);
  }
  .sub {
    font-size: 8px; color: #ffff00; margin-bottom: 28px; line-height: 1.8;
    text-shadow: 0 0 8px #ffff00;
  }
  .big {
    font-size: 90px; line-height: 1; margin: 24px 0;
    color: #ff00ff;
    text-shadow: 4px 0 0 #0ff, -4px 0 0 #ffff00, 0 0 30px #ff00ff;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .status-box {
    background: #001a1a; padding: 18px 20px; margin-top: 24px;
    border: 2px solid #0ff; text-align: left;
    font-size: 9px; line-height: 2;
  }
  .status-box .line { color: #0ff; }
  .status-box .ok { color: #00ff00; }
  .status-box .hi { color: #ff00ff; }
  .blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="card">
  <div class="version">&lt;&lt; ITERATION // 05 &gt;&gt;</div>
  <h1>🎮 覆盖测试报告</h1>
  <div class="sub">RETRO ARCADE EDITION</div>

  <div class="big">V5</div>

  <div class="status-box">
    <div class="line">&gt; SYSTEM: READY_</div>
    <div class="line">&gt; VERSION: <span class="hi">V5 RETRO</span></div>
    <div class="line">&gt; PREV:    V4 NEWSPAPER</div>
    <div class="line">&gt; CACHE:   <span class="ok">BYPASSED ✓</span></div>
    <div class="line">&gt; REFRESH: <span class="ok">NOT REQUIRED ✓</span></div>
    <div class="line">&gt; STATUS:  <span class="ok">OPERATIONAL</span></div>
    <div class="line">&gt; _<span class="blink">█</span></div>
  </div>
</div>
</body>
</html>
