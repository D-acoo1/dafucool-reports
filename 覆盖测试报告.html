<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>覆盖测试报告 · v4</title>
<style>
  body {
    margin:0; min-height:100vh; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fefefe;
    color:#1a1a1a; display:flex; align-items:center; justify-content:center; padding:40px 20px;
  }
  .card {
    background: #fff; border-radius: 0;
    padding: 56px 64px; max-width: 680px; width: 100%;
    border-left: 8px solid #ffcc00;
    box-shadow: 0 2px 30px rgba(0,0,0,0.08);
    position: relative;
  }
  .card::before {
    content: ''; position: absolute; top: -8px; left: -8px; right: -8px; bottom: -8px;
    border: 1px solid #eee; pointer-events: none;
  }
  .version {
    font-family: 'Courier New', monospace;
    color: #999; font-size: 12px; letter-spacing: 3px; margin-bottom: 8px;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 4px; font-size: 36px; font-weight: 900; letter-spacing: -1px;
    color: #1a1a1a;
  }
  .sub {
    font-size: 15px; color: #666; margin-bottom: 32px;
    font-style: italic;
  }

  .big-wrap {
    padding: 30px 0; border-top: 2px solid #1a1a1a; border-bottom: 2px solid #1a1a1a;
    margin: 28px 0; text-align: center;
  }
  .big {
    font-size: 120px; font-weight: 900; line-height: 1;
    letter-spacing: -4px; color: #1a1a1a;
    font-family: 'Georgia', serif;
  }
  .big .num { color: #ffcc00; }

  .columns {
    display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin: 24px 0;
  }
  .col h4 {
    margin: 0 0 8px; font-size: 12px; letter-spacing: 2px; color: #999;
    text-transform: uppercase;
  }
  .col p {
    margin: 0; font-size: 14px; line-height: 1.7; color: #333;
  }

  .footnote {
    margin-top: 28px; padding-top: 16px; border-top: 1px dashed #ddd;
    font-size: 12px; color: #999; text-align: center; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="version">ITERATION № 04</div>
  <h1>覆盖测试报告</h1>
  <div class="sub">— 报纸版 · 朴素黑白加一抹亮黄 —</div>

  <div class="big-wrap">
    <div class="big">V<span class="num">4</span></div>
  </div>

  <div class="columns">
    <div class="col">
      <h4>📰 设计变化</h4>
      <p>本次从 V3 深空炫酷切到报纸风的极简黑白。字体改用衬线，颜色减到只有亮黄点缀。验证<b>视觉风格剧变</b>时浏览器是否还能瞬间跟上。</p>
    </div>
    <div class="col">
      <h4>🎯 预期效果</h4>
      <p>你应该<b>不用强制刷新</b>、<b>不用关标签页</b>，点开"覆盖测试报告"直接看到这份黑白报纸风。如果是，说明防缓存机制已完全工作。</p>
    </div>
  </div>

  <div class="footnote">— END OF V4 · 期待下一次迭代 —</div>
</div>
</body>
</html>
