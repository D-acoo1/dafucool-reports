<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>基金实时估算涨跌</title>
<style>
:root{--bg:#0b1020;--panel:#111827;--soft:#151f33;--head:#0f172a;--text:#eef2ff;--muted:#94a3b8;--line:rgba(148,163,184,.18);--red:#ff6b6b;--green:#34d399;--gold:#d6b36a;--blue:#8fb5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#080d1a 0%,var(--bg) 55%,#090d18 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}main{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:24px 0 36px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:16px}h1{margin:0 0 8px;font-size:clamp(26px,5vw,42px);line-height:1.1;color:#fff7df}.sub{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button{border:1px solid rgba(214,179,106,.45);background:linear-gradient(180deg,rgba(214,179,106,.18),rgba(214,179,106,.08));color:var(--text);border-radius:8px;min-height:42px;padding:0 14px;font-size:15px}.badge{display:inline-flex;align-items:center;min-height:30px;padding:4px 10px;border-radius:999px;background:rgba(143,181,255,.14);color:#d7e2ff;font-weight:700}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}.mini{background:linear-gradient(180deg,rgba(21,31,51,.96),rgba(15,23,42,.96));border:1px solid var(--line);border-radius:8px;padding:12px 14px}.mini .label{color:var(--muted);font-size:13px;margin-bottom:5px}.mini .value{font-size:20px;font-weight:800}.table-wrap{overflow-x:auto;background:rgba(17,24,39,.96);border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:1040px}th,td{padding:14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:14px}th{color:#cbd5e1;background:var(--head);white-space:nowrap}tbody tr:nth-child(even){background:rgba(21,31,51,.72)}.code,.num{font-variant-numeric:tabular-nums;white-space:nowrap}.code{color:#c9a85f}.name{font-weight:700;min-width:210px}.rise{color:var(--red);font-weight:800}.fall{color:var(--green);font-weight:800}.flat{color:var(--muted);font-weight:800}.tag-list{display:flex;gap:6px;flex-wrap:wrap;min-width:160px}.tag{display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.tech{background:rgba(72,99,180,.24);color:#b8c7ff}.index{background:rgba(29,126,92,.22);color:#94e6c0}.medical{background:rgba(167,76,128,.22);color:#f3bad8}.gold{background:rgba(214,179,106,.24);color:#f2d99a}.risk{background:rgba(180,58,58,.24);color:#ffaaaa}.status-pill{display:inline-flex;align-items:center;min-height:28px;padding:4px 10px;border-radius:999px;background:rgba(148,163,184,.12);color:var(--muted);font-size:13px;font-weight:800;white-space:nowrap}.live{background:rgba(72,99,180,.24);color:var(--blue)}.done{background:rgba(29,126,92,.22);color:var(--green)}.wait{background:rgba(214,179,106,.20);color:#f2d99a}.note,.hint,.err{margin-top:14px;line-height:1.7;font-size:14px}.note{color:var(--muted)}.hint{display:none;padding:12px 14px;border-radius:8px;background:rgba(214,179,106,.12);color:#f2d99a;border:1px solid rgba(214,179,106,.28)}.err{display:none;padding:12px 14px;border-radius:8px;background:rgba(180,58,58,.16);color:#ffb4b4;border:1px solid rgba(255,107,107,.32)}@media(max-width:760px){main{width:min(100% - 20px,1120px);padding-top:18px}.top{display:block}.actions{margin-top:12px;justify-content:flex-start}.summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.mini{padding:10px 8px}.mini .label{font-size:12px}.mini .value{font-size:16px}th,td{padding:11px 9px;font-size:13px}}
</style>
</head>
<body>
<main>
<section class="top"><div><h1>基金实时估算涨跌</h1><p class="sub">上涨红色，下跌绿色。页面每分钟自动刷新，也可以手动刷新。</p></div><div class="actions"><span class="badge" id="status">正在加载</span><button id="refresh" type="button">立即刷新</button></div></section>
<section class="summary"><div class="mini"><div class="label">上涨基金</div><div class="value rise" id="riseCount">--</div></div><div class="mini"><div class="label">下跌基金</div><div class="value fall" id="fallCount">--</div></div><div class="mini"><div class="label">最后刷新</div><div class="value" id="lastRefresh">--</div></div></section>
<section class="table-wrap"><table><thead><tr><th>代码</th><th>标签</th><th>基金名称</th><th>盘中估算</th><th>估算净值</th><th>晚间正式涨跌</th><th>晚间正式净值</th><th>正式日期</th><th>数据状态</th><th>估算时间</th></tr></thead><tbody id="fundRows"><tr><td colspan="10">正在读取数据...</td></tr></tbody></table></section>
<div class="err" id="errorBox"></div><div class="hint" id="marketHint"></div><p class="note">说明：盘中估算只作白天参考；晚间正式净值才是当天最终结果。</p>
</main>
<script>
const funds=[
{code:"000217",fallbackName:"华安黄金ETF联接C",tags:["黄金","避险"]},
{code:"011892",fallbackName:"易方达先锋成长混合C",tags:["成长","高波动"]},
{code:"019018",fallbackName:"易方达信息产业混合C",tags:["核心持仓","AI算力","高波动"]},
{code:"017103",fallbackName:"大摩数字经济混合C",tags:["数字经济","高波动"]},
{code:"022365",fallbackName:"永赢科技智选混合发起C",tags:["科技","高波动"]},
{code:"010732",fallbackName:"广发创新医疗两年持有混合C",tags:["医疗","两年持有"]},
{code:"016690",fallbackName:"鹏华沪深300指数增强C",tags:["沪深300","指数增强"]}
];
const rowsEl=document.getElementById("fundRows"),statusEl=document.getElementById("status"),errorBox=document.getElementById("errorBox"),riseCountEl=document.getElementById("riseCount"),fallCountEl=document.getElementById("fallCount"),lastRefreshEl=document.getElementById("lastRefresh"),refreshBtn=document.getElementById("refresh"),marketHintEl=document.getElementById("marketHint");
function jsonp(url,timeoutMs=8000){return new Promise((resolve,reject)=>{const script=document.createElement("script");const cb="jsonpgz";const timer=setTimeout(()=>{cleanup();reject(new Error("读取超时"))},timeoutMs);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error("读取失败"))};script.src=`${url}${url.includes("?")?"&":"?"}rt=${Date.now()}`;document.body.appendChild(script)})}
function loadScript(url,timeoutMs=10000){return new Promise((resolve,reject)=>{const script=document.createElement("script");const timer=setTimeout(()=>{cleanup();reject(new Error("读取超时"))},timeoutMs);function cleanup(){clearTimeout(timer);script.remove()}script.onload=()=>{cleanup();resolve()};script.onerror=()=>{cleanup();reject(new Error("读取失败"))};script.src=`${url}${url.includes("?")?"&":"?"}rt=${Date.now()}`;document.body.appendChild(script)})}
function formatDateFromMs(ms){if(!Number.isFinite(Number(ms)))return"";const d=new Date(Number(ms));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function compareDate(a,b){if(!a&&!b)return 0;if(!a)return-1;if(!b)return 1;return a.localeCompare(b)}
function calculateChange(current,previous){const c=Number(current),p=Number(previous);if(!Number.isFinite(c)||!Number.isFinite(p)||p===0)return"";return((c/p-1)*100).toFixed(2)}
async function loadFinalNav(code){window.Data_netWorthTrend=undefined;await loadScript(`https://fund.eastmoney.com/pingzhongdata/${code}.js?v=${Date.now()}`);const trend=Array.isArray(window.Data_netWorthTrend)?window.Data_netWorthTrend:[];const latest=trend.at(-1);if(!latest)return null;return{date:formatDateFromMs(latest.x),nav:latest.y,change:latest.equityReturn,previousNav:trend.at(-2)?.y||""}}
function pctClass(v){const n=Number(v);if(n>0)return"rise";if(n<0)return"fall";return"flat"}function signedPct(v){const n=Number(v);if(!Number.isFinite(n))return"--";return`${n>0?"+":""}${n.toFixed(2)}%`}function dateFromDateTime(v){return String(v||"").slice(0,10)}function displayText(v){return v===undefined||v===null||v===""?"--":String(v)}
function tagClass(t){if(["AI算力","科技","数字经济","成长"].includes(t))return"tech";if(["沪深300","指数增强"].includes(t))return"index";if(["医疗","两年持有"].includes(t))return"medical";if(["黄金","避险"].includes(t))return"gold";if(["高波动"].includes(t))return"risk";return"tech"}function renderTags(tags=[]){return`<div class="tag-list">${tags.map(t=>`<span class="tag ${tagClass(t)}">${t}</span>`).join("")}</div>`}
function statusInfo(item,finalIsToday){if(finalIsToday)return{text:"正式已出",cls:"done"};const ed=dateFromDateTime(item.gztime),today=new Date().toISOString().slice(0,10);if(ed===today)return{text:"盘中估算",cls:"live"};if(item.finalDate)return{text:"等晚间净值",cls:"wait"};return{text:"数据待更新",cls:"wait"}}
function nowText(){return new Intl.DateTimeFormat("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date())}
function updateMarketHint(list){const now=new Date(),day=now.getDay(),m=now.getHours()*60+now.getMinutes(),isWeekday=day>=1&&day<=5,latest=list.map(i=>i.gztime).filter(Boolean).sort().at(-1);let text="";if(isWeekday&&m>=900)text=`现在已经收盘，页面仍在刷新，但估算数据源通常会停在 15:00 左右；黄金相关基金可能停在 15:30 左右。当前数据源最后时间：${latest||"--"}。`;else if(isWeekday&&m>=690&&m<780)text=`现在是午休时间，A 股相关基金估算通常会停在 11:30 左右。当前数据源最后时间：${latest||"--"}。`;marketHintEl.textContent=text;marketHintEl.style.display=text?"block":"none"}
function render(list){let rise=0,fall=0;rowsEl.innerHTML=list.map(item=>{const pct=Number(item.gszzl);if(pct>0)rise++;if(pct<0)fall++;const cls=pctClass(item.gszzl),name=item.name||item.fallbackName,estimateDate=dateFromDateTime(item.gztime),finalIsToday=item.finalDate&&estimateDate&&item.finalDate===estimateDate,finalChangeText=finalIsToday?signedPct(item.finalChange):"未出今天净值",finalNavText=finalIsToday?displayText(item.finalNav):"未更新",finalDateText=item.finalDate?`${item.finalDate}${finalIsToday?"":"（旧）"}`:"--",status=statusInfo(item,finalIsToday);return`<tr><td class="code">${item.fundcode}</td><td>${renderTags(item.tags)}</td><td class="name">${name}</td><td class="num ${cls}">${signedPct(item.gszzl)}</td><td class="num">${item.gsz||"--"}</td><td class="num ${finalIsToday?pctClass(item.finalChange):"flat"}">${finalChangeText}</td><td class="num">${finalNavText}</td><td class="num">${finalDateText}</td><td><span class="status-pill ${status.cls}">${status.text}</span></td><td class="num">${item.gztime||"--"}</td></tr>`}).join("");riseCountEl.textContent=`${rise} 只`;fallCountEl.textContent=`${fall} 只`;lastRefreshEl.textContent=nowText();updateMarketHint(list)}
async function refreshData(){statusEl.textContent="正在刷新";errorBox.style.display="none";refreshBtn.disabled=true;try{const list=[];for(const fund of funds){const data=await jsonp(`https://fundgz.1234567.com.cn/js/${fund.code}.js`);let finalData=null;try{finalData=await loadFinalNav(fund.code)}catch(e){finalData=null}list.push({...fund,...data,finalDate:compareDate(data.jzrq,finalData?.date||"")>0?data.jzrq:(finalData?.date||data.jzrq||""),finalNav:compareDate(data.jzrq,finalData?.date||"")>0?data.dwjz:(finalData?.nav||data.dwjz||""),finalChange:compareDate(data.jzrq,finalData?.date||"")>0?calculateChange(data.dwjz,finalData?.nav):(finalData?.change||"")})}render(list);statusEl.textContent="已更新"}catch(e){statusEl.textContent="读取失败";errorBox.textContent=`数据暂时没取到，可以稍后再刷新。原因：${e.message}`;errorBox.style.display="block"}finally{refreshBtn.disabled=false}}
refreshBtn.addEventListener("click",refreshData);refreshData();setInterval(refreshData,60000);
</script>
</body>
</html>
