<script>
"use strict";
const D=JSON.parse(document.getElementById('report-data').textContent);
const marks=['30日付费用户','超30天付费用户'];
const markName=m=>m==='超30天付费用户'?'超30日付费':m.replace('用户','');
let state={month:0,mark:'both',tab:'overview',nocharge:true,sample:8582766,userView:'gift',thresholdScope:'experiment'};
const n=(x,d=0)=>Number(Number(x||0).toFixed(8)).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=x=>'$'+n(x,2), pct=(a,b,d=1)=>b?n(a/b*100,d)+'%':'—';
const rate=(a,b)=>n(a)+' / '+n(b)+' <span class="table-sub">'+pct(a,b,2)+'</span>';
const title=()=>state.month?state.month+'月':'三个月累计';
const selected=a=>a.filter(r=>r.month===state.month&&(state.mark==='both'||r.mark===state.mark));
const rows=key=>selected(D[key]);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const th=(x,num=false)=>'<th'+(num?' class="numcell"':'')+'>'+x+'</th>';
const td=(x,num=false)=>'<td'+(num?' class="numcell"':'')+'>'+x+'</td>';
function table(head,body,cls=''){return '<div class="table-scroll"><table class="'+cls+'"><thead><tr>'+head.map(x=>th(typeof x==='string'?x:x[0],Array.isArray(x)&&x[1])).join('')+'</tr></thead><tbody>'+body.join('')+'</tbody></table></div>';}
const card=(h,b,cls='')=>'<div class="card '+cls+'">'+(h?'<h3>'+h+'</h3>':'')+b+'</div>';
const note=(s,w=false)=>'<div class="note'+(w?' warn':'')+'">'+s+'</div>';
const jump=(tab,text)=>'<button data-jump="'+tab+'">'+text+' →</button>';
function head(h,s){return '<div class="section-head"><h2>'+h+'</h2><div class="sub">'+s+'</div></div>';}
function kpi(label,value,sub){return '<div class="kpi"><div class="label">'+label+'</div><strong>'+value+'</strong><small>'+sub+'</small></div>';}
function getSum(m){return D.summary.find(r=>r.month===state.month&&r.mark===m);}
function costShare(r){return pct(r.cost_usd,getSum(r.mark).cost_usd);}
function sum(a,k){return a.reduce((s,r)=>s+(Number(r[k])||0),0);}
function bars(a,total,fn,colors=false){return '<div class="bars">'+a.map((r,i)=>'<div class="bar-row"><span class="bar-label">'+fn(r)+'</span><div class="bar-track" title="'+esc(usd(r.value)+' / '+usd(total)+' = '+pct(r.value,total,2))+'"><div class="bar-fill'+(colors&&i%2?' orange':'')+'" style="width:'+Math.min(100,r.value/total*100)+'%"></div></div><span class="bar-val">'+usd(r.value)+'<span class="table-sub">'+pct(r.value,total)+'</span></span></div>').join('')+'</div>';}
function overview(){
 const a=rows('summary'),total=sum(a,'cost_usd'),comb=D.combined.find(r=>r.month===state.month),days=a[0].days;
 const platform=D.financial.rows.find(r=>r.period===(state.month?state.month+'月':'三个月合计')&&r.mark==='全平台合计');
 let s=head('先把结论说清楚','金额单位均为美元；任务人数和次数按去重后的发奖记录计算。');
 s+='<div class="kpis">'+kpi('所选用户任务成本',usd(total),'日均 '+usd(total/days))+kpi('占全平台任务成本',pct(total,platform.validCost),'全平台包含未对应到具体用户的任务费用')+kpi('被完成任务的用户',n(state.mark==='both'?comb.users:a[0].people),'期间按 UID 去重，跨月人数不能直接相加')+kpi('任务发奖次数',n(sum(a,'nodes')),'日均 '+n(sum(a,'nodes')/days,1)+' 次')+'</div>';
 s+='<div class="small" style="margin-bottom:10px">以下三条为 8—10 月三个月的结论，不随筛选改写。</div><div class="grid3">';
 s+='<div class="finding"><span class="num">01 · 先找主要花费</span><h3>48.3% 的成本，花在近期只送了少量礼物的用户上</h3><p>前 3 天没有充值、送礼合计 100—499 钻：两层合计任务成本 $21,869.08。当天充值比例分别为 1.55% 和 2.97%。</p>'+jump('users','看各档用户的金额和人数')+'</div>';
 s+='<div class="finding"><span class="num">02 · 再看奖励给了谁</span><h3>37.8% 的成本，未对应到近 4 天的付费送礼关系</h3><p>拿到奖励的主播，在前 3 天和当天均没收到该用户的付费礼物，涉及 $17,109.42。更早有无送礼，本轮未据此判断。</p>'+jump('anchors','看主播人数与送礼关系')+'</div>';
 s+='<div class="finding"><span class="num">03 · 抽查 230</span><h3>有零充值、零消费仍发奖的记录，但尚不能定为 bug</h3><p>最严格的 16 名样本，当前登录端均为 Android，版本均低于代码中的启用门槛。已复核 5 个样本的逐笔奖励和实验状态。</p>'+jump('audit','看汇总核查证据')+'</div></div>';
 s+=card('这两类用户要分开看',note('这里把<strong>被完成任务的同一批 UID</strong>与其<strong>发奖当天</strong>的充值、消费关联起来。即使当天充值后换了分层，也保留这笔钱。'+
 '表中金额只是同一天发生，不能说都是任务带来的。')+
 table(['用户','任务成本',['当天充值',true],['当天消费',true],['充值 ÷ 成本',true],['消费 ÷ 成本',true]],a.map(r=>'<tr>'+td(markName(r.mark))+td(usd(r.cost_usd),true)+td(usd(r.charge_usd),true)+td(usd(r.consume_usd),true)+td(n(r.charge_usd/r.cost_usd,2),true)+td(n(r.consume_usd/r.cost_usd,2),true)+'</tr>'))+
 '<p class="small" style="margin-top:12px">超 30 日付费仍有较高贡献的用户。现有数据支持挑出低效花费做实验，不能支持整层停掉任务。</p>');
 s+=card('8、9、10 月各自数据、累计和日均',table(['月份','用户',['任务成本 / 日均',true],['去重用户 / 日均被完成人数',true],['发奖次数 / 日均',true],['拿奖主播',true]],D.summary.filter(r=>state.mark==='both'||r.mark===state.mark).map(r=>'<tr'+(!r.month?' class="row-accent"':'')+'>'+td(r.period)+td(markName(r.mark))+td(usd(r.cost_usd)+'<span class="table-sub">日均 '+usd(r.daily_cost_usd)+'</span>',true)+td(n(r.people)+'<span class="table-sub">日均 '+n(r.daily_served_users,1)+' 人</span>',true)+td(n(r.nodes)+'<span class="table-sub">日均 '+n(r.daily_nodes,1)+' 次</span>',true)+td(n(r.anchors),true)+'</tr>'))+
 '<p class="small" style="margin-top:12px">日均人数 = 每天去重人数之和 ÷ 该周期天数；不是“期间去重人数 ÷ 天数”。两层三个月合并后为 9,859 人，同一人可能先后出现在两层。</p>');
 s+=card('数据支持先做的动作',recommendations());
