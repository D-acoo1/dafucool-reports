<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>主播任务体系线上现状看板</title>
<style>
:root {
  --bg:#f5f7fb; --panel:#fff; --ink:#182235; --muted:#66758a; --line:#d9e2ee;
  --blue:#1f5f99; --blue-soft:#eaf3fb; --green:#18815f; --green-soft:#e8f6ef;
  --amber:#a76400; --amber-soft:#fff2dc; --red-soft:#fde8df; --gray:#f2f5f8;
  --shadow:0 10px 30px rgba(25,45,80,.08);
}
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
header { position:sticky; top:0; z-index:10; background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.top { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:18px 28px 14px; }
h1 { margin:0; font-size:24px; letter-spacing:0; }
.filters { display:flex; align-items:end; gap:12px; flex-wrap:wrap; }
.field label { display:block; color:var(--muted); font-size:12px; margin-bottom:6px; }
select { min-width:180px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); font-size:14px; }
button { border:1px solid var(--line); background:#fff; border-radius:9px; padding:10px 12px; cursor:pointer; color:var(--ink); }
button.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
.wrap { padding:18px 28px 34px; }
.kpis { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:14px; }
.kpi { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }
.kpi .t { color:var(--muted); font-size:12px; } .kpi .n { font-size:28px; font-weight:800; margin-top:4px; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 16px; }
.tab { border-radius:999px; padding:9px 13px; color:var(--muted); } .tab.active { background:var(--blue); color:#fff; border-color:var(--blue); }
.section { display:none; } .section.active { display:block; }
.grid { display:grid; grid-template-columns:1fr; gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
.cardHead { padding:13px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; align-items:flex-start; background:#fbfdff; }
.title { font-size:18px; font-weight:800; }
.segment { display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; }
.pill { display:inline-flex; border-radius:999px; padding:4px 9px; background:var(--blue-soft); color:#1d5688; font-size:12px; white-space:nowrap; }
.pill.green { background:var(--green-soft); color:var(--green); } .pill.amber { background:var(--amber-soft); color:var(--amber); }
.cardBody { padding:0; }
.row2 { display:block; }
.panel { border:0; border-radius:0; background:#fff; padding:0; }
.panel h3 { margin:0; font-size:13px; color:#26364d; }
.facts { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.fact { background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px; min-height:64px; }
.fact b { display:block; color:var(--muted); font-size:12px; font-weight:500; margin-bottom:5px; }
.threshold { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; }
.thBox { background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px; } .thBox b { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; font-weight:500; }
.arrow { color:var(--muted); font-weight:700; }
.dist { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.dist div { border-left:4px solid var(--blue); background:#f8fbff; border-radius:8px; padding:9px 10px; line-height:1.45; }
.dist b { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; font-weight:500; }
.tasks { display:grid; gap:9px; }
.task { border:1px solid var(--line); border-radius:10px; background:#fff; padding:10px; }
.taskTop { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; margin-bottom:7px; }
.taskName { font-weight:800; color:#24344b; }
.reward { color:var(--green); font-size:12px; background:var(--green-soft); border-radius:999px; padding:3px 8px; white-space:nowrap; }
.nodes { display:flex; flex-wrap:wrap; gap:5px; margin:7px 0; }
.node { background:var(--blue-soft); color:#1d5688; padding:4px 7px; border-radius:7px; font-size:12px; white-space:nowrap; }
.rule { color:#3f4d63; font-size:12px; line-height:1.45; } .rule span { color:var(--muted); }

.configStrip { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border-bottom:1px solid var(--line); }
.configItem { padding:12px 14px; border-right:1px solid var(--line); min-height:72px; }
.configItem:last-child { border-right:0; }
.configItem b { display:block; color:var(--muted); font-size:12px; font-weight:500; margin-bottom:6px; }
.configItem strong { display:block; font-size:16px; line-height:1.35; }
.configItem .small { color:#3f4d63; font-size:13px; line-height:1.45; }
.configItem.accent { background:var(--blue-soft); }
.configItem.good { background:var(--green-soft); }
.ruleBand { display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--line); }
.ruleBlock { padding:12px 14px; border-right:1px solid var(--line); background:#fff; }
.ruleBlock:last-child { border-right:0; }
.ruleBlock b { display:block; color:var(--muted); font-size:12px; font-weight:500; margin-bottom:5px; }
.taskTableCompact { width:100%; border-collapse:collapse; }
.taskTableCompact th { position:static; background:#f8fafc; font-size:12px; color:#526174; padding:8px 10px; }
.taskTableCompact td { padding:9px 10px; font-size:12px; }
.taskTypeCell { width:112px; font-weight:800; color:#24344b; }
.nodeList { display:flex; flex-wrap:wrap; gap:4px; }
.nodeList .node { margin:0; }
.rewardText { color:var(--green); font-weight:700; white-space:pre-line; }
.ruleText { color:#3f4d63; line-height:1.45; }

table { width:100%; border-collapse:collapse; background:#fff; }
th,td { border-bottom:1px solid var(--line); padding:10px; text-align:left; vertical-align:top; font-size:13px; line-height:1.45; }
th { background:#f1f5f9; color:#334155; font-weight:800; position:sticky; top:0; z-index:1; }
.matrix,.distBox { background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:auto; }
.matrix td,.matrix th { min-width:150px; } .matrix td:first-child,.matrix th:first-child { min-width:110px; position:sticky; left:0; background:#fff; z-index:2; }
.matrix th:first-child { background:#f1f5f9; }
.nodeCell { background:#fbfdff; } .nodeWrap { display:flex; flex-wrap:wrap; gap:5px; }
.okChip { display:inline-flex; background:var(--green-soft); color:var(--green); border-radius:7px; padding:4px 6px; font-size:12px; font-weight:700; }
.emptyCell { color:#a0adbd; text-align:center; background:#f8fafc; }
.distGrid { display:grid; grid-template-columns:1fr; gap:14px; }
.distTitle { font-size:18px; font-weight:800; margin:0 0 10px; }
.bar { height:22px; min-width:96px; background:#edf2f7; border:1px solid #dbe4ef; border-radius:999px; overflow:hidden; }
.bar span { display:block; height:100%; background:#5b9bd5; }
.pct { display:flex; align-items:center; gap:8px; }
.empty { background:#fff; border:1px solid var(--line); border-radius:12px; padding:32px; text-align:center; color:var(--muted); }
@media(max-width:900px) { .top { align-items:flex-start; flex-direction:column; } .filters { width:100%; } select { min-width:0; width:100%; } .field { flex:1 1 180px; } .kpis { grid-template-columns:1fr; } .grid { grid-template-columns:1fr; } .row2,.dist,.ruleBand { grid-template-columns:1fr; } .facts,.configStrip { grid-template-columns:1fr; } .configItem,.ruleBlock { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>

        <div class="configItem"><b>日均充值</b><strong>${fmtMoney(s['分群-日均充值($)'])}</strong></div>
        <div class="configItem accent"><b>历史过滤</b><div class="small">${esc(s['历史过滤-小时'])} / 小时<br>${esc(s['历史过滤-日'])} / 日</div></div>
        <div class="configItem good"><b>当前/新过滤</b><div class="small">${esc(s['当前/新过滤-小时'])} / 小时<br>${esc(s['当前/新过滤-日'])} / 日</div></div>
      </div>
      <div class="ruleBand">
        <div class="ruleBlock"><b>用户看主播分发</b>${esc(s['用户看主播分发'])}</div>
        <div class="ruleBlock"><b>主播看用户权重/池</b>${esc(s['主播看用户权重/池']).replace(/30日付费/g,'30日付费/超30日付费')}</div>
      </div>
      <table class="taskTableCompact">
        <thead><tr><th>任务类型</th><th>节点</th><th>奖励</th><th>释放/配额</th><th>说明</th></tr></thead>
        <tbody>${s['任务'].map(t=>`<tr><td class="taskTypeCell">${esc(taskDisplay(t['任务类型']))}</td><td><div class="nodeList">${splitNodes(t['任务节点']).map(n=>`<span class="node">${esc(n)}</span>`).join('')}</div></td><td class="rewardText">${esc(t['奖励内容'])} ${esc(t['奖励金额'])}</td><td class="ruleText">${esc(t['任务释放/配额规则'])}</td><td class="ruleText">${esc(t['任务限制/说明'])}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  </article>`).join('');
}
function renderMatrix(data) {
  const layers=[...new Set(data.map(s=>s['用户分层']))];
  let html='<table><thead><tr><th>用户分层</th>'+taskOrder.map(t=>`<th>${esc(t)}</th>`).join('')+'</tr></thead><tbody>';
  for(const l of layers) {
    const layerSegs=data.filter(s=>s['用户分层']===l);
    html+=`<tr><th>${esc(l)}</th>`;
    for(const task of taskOrder) {
      const related=layerSegs.flatMap(s=>s['任务'].filter(t=>taskDisplay(t['任务类型'])===task));
      if(!related.length) html+='<td class="emptyCell">-</td>';
      else {
        const nodes=[...new Set(related.flatMap(t=>splitNodes(t['任务节点'])))];
        html+=`<td class="nodeCell"><div class="nodeWrap">${nodes.map(n=>`<span class="okChip">${esc(n)}</span>`).join('')}</div></td>`;
      }
    }
    html+='</tr>';
  }
  html+='</tbody></table>'; el('matrixBox').innerHTML=html;
}
function bar(v) { return `<div class="pct"><div class="bar"><span style="width:${v}%"></span></div><b>${v}%</b></div>`; }
function renderDist() {
  let h='<table><thead><tr><th>用户分层</th><th>S级</th><th>A级</th><th>B级</th><th>女普通</th></tr></thead><tbody>';
  h+=userDist.map(r=>`<tr><td>${esc(r['用户分层'])}</td><td>${bar(r['S级'])}</td><td>${bar(r['A级'])}</td><td>${bar(r['B级'])}</td><td>${bar(r['女普通'])}</td></tr>`).join('');
  h+='</tbody></table>'; el('userDist').innerHTML=h;
  const cols=['新付费','近3日付费','新高潜','大R','30日付费/超30日付费','高潜','新普通'];
  let a='<table><thead><tr><th>主播池</th>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>';
  a+=anchorDist.map(r=>`<tr><td>${esc(r['主播池'])}</td>`+cols.map(c=>`<td>${bar(r[c]||0)}</td>`).join('')+'</tr>').join('');
  a+='</tbody></table>'; el('anchorDist').innerHTML=a;
}
function render() { const data=filtered(); el('kSeg').textContent=data.length; el('kLayer').textContent=new Set(data.map(s=>s['用户分层'])).size; el('kTask').textContent=data.reduce((a,s)=>a+s['任务'].length,0); renderCards(data); renderMatrix(data); renderDist(); }
for(const l of layerOrder) el('layer').insertAdjacentHTML('beforeend',`<option>${esc(l)}</option>`);
for(const t of taskOrder) el('task').insertAdjacentHTML('beforeend',`<option>${esc(t)}</option>`);
el('apply').onclick=render; el('reset').onclick=()=>{el('layer').value='';el('task').value='';render();};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');el(b.dataset.tab).classList.add('active');});
render();
</script>
</body>
</html>
