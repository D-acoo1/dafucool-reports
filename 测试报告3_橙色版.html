<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>测试报告 3 · 橙色版</title>
<style>
  body {
    margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #ff9a44 0%, #fc6076 100%);
    min-height: 100vh; color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: rgba(255,255,255,0.14); backdrop-filter: blur(24px);
    border-radius: 22px; padding: 44px 52px; max-width: 660px; width: 100%;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 24px 64px rgba(0,0,0,0.25);
  }
  .tag-top {
    display:inline-block; padding:4px 10px; border-radius:6px;
    background:#fff; color:#fc6076; font-size:11px; font-weight:700;
    letter-spacing:1.5px; margin-bottom:12px;
  }
  h1 { margin: 0 0 8px; font-size: 30px; }
  .sub { font-size: 14px; opacity: 0.88; margin-bottom: 28px; }

  .kpis { display: flex; gap: 16px; margin: 24px 0; flex-wrap: wrap; }
  .kpi {
    flex:1; min-width: 140px; background: rgba(255,255,255,0.15);
    padding: 18px 20px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .kpi .title { font-size: 12px; opacity: 0.85; margin-bottom: 6px; }
  .kpi .val { font-size: 24px; font-weight: 700; line-height: 1.1; }
  .kpi .trend { font-size: 12px; margin-top: 4px; opacity: 0.9; }
  .up { color: #c6f6d5; }
  .down { color: #fed7d7; }

  /* 折线图 */
  .chart { margin: 24px 0; }
  svg { width: 100%; height: 140px; display:block; }
  .grid line { stroke: rgba(255,255,255,0.15); }
  .line { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .fill { fill: rgba(255,255,255,0.18); }
  .dot { fill: #fff; }
  .axis text { fill: rgba(255,255,255,0.75); font-size: 10px; }

  .footer {
    margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.22);
    font-size: 13px; opacity: 0.9; line-height: 1.65;
  }
</style>
</head>
<body>
<div class="card">
  <div class="tag-top">TEST 003</div>
  <h1>🍊 测试报告（橙色版）</h1>
  <div class="sub">验证修复后的删除流程：删完、刷新、不再出现残影</div>

  <div class="kpis">
    <div class="kpi">
      <div class="title">日活用户</div>
      <div class="val">12,480</div>
      <div class="trend up">↑ +8.3% WoW</div>
    </div>
    <div class="kpi">
      <div class="title">转化率</div>
      <div class="val">4.6%</div>
      <div class="trend up">↑ +0.4pt</div>
    </div>
    <div class="kpi">
      <div class="title">流失率</div>
      <div class="val">2.1%</div>
      <div class="trend down">↓ -0.3pt</div>
    </div>
  </div>

  <div class="chart">
    <svg viewBox="0 0 500 140" preserveAspectRatio="none">
      <g class="grid">
        <line x1="0" y1="30"  x2="500" y2="30" />
        <line x1="0" y1="70"  x2="500" y2="70" />
        <line x1="0" y1="110" x2="500" y2="110"/>
      </g>
      <!-- 填充 -->
      <path class="fill" d="M 20,95 L 90,78 L 160,85 L 230,55 L 300,62 L 370,40 L 440,25 L 480,20 L 480,130 L 20,130 Z" />
      <!-- 折线 -->
      <path class="line" d="M 20,95 L 90,78 L 160,85 L 230,55 L 300,62 L 370,40 L 440,25 L 480,20" />
      <!-- 点 -->
      <circle class="dot" cx="20" cy="95" r="3.5"/>
      <circle class="dot" cx="90" cy="78" r="3.5"/>
      <circle class="dot" cx="160" cy="85" r="3.5"/>
      <circle class="dot" cx="230" cy="55" r="3.5"/>
      <circle class="dot" cx="300" cy="62" r="3.5"/>
      <circle class="dot" cx="370" cy="40" r="3.5"/>
      <circle class="dot" cx="440" cy="25" r="3.5"/>
      <circle class="dot" cx="480" cy="20" r="3.5"/>
      <g class="axis">
        <text x="20"  y="138">W1</text>
        <text x="88"  y="138">W2</text>
        <text x="158" y="138">W3</text>
        <text x="228" y="138">W4</text>
        <text x="298" y="138">W5</text>
        <text x="368" y="138">W6</text>
        <text x="438" y="138">W7</text>
        <text x="476" y="138">W8</text>
      </g>
    </svg>
  </div>

  <div class="footer">
    <b>📋 验证流程：</b><br>
    1. 在云端目录点这份报告的 🗑<br>
    2. 点"确认删除" → 报告立刻从列表消失<br>
    3. <b>强制刷新页面（Cmd+Shift+R）</b> → 它<b>不应该</b>再出现（即使本地还有同名文件）<br>
    4. 若验证通过 → 删除流程已完美工作 🎉
  </div>
</div>
</body>
</html>
