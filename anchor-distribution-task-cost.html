          button.addEventListener("click",()=>{state.hidden=state.hidden.includes(metric.key)?state.hidden.filter(k=>k!==metric.key):state.hidden.concat(metric.key);clearTip();render(true);const next=panels.querySelector('button[data-metric="'+metric.key+'"]');if(next)next.focus();save();});legend.appendChild(button);
        });
        figure.appendChild(legend);
        const plot=document.createElement("div");plot.className="plot";figure.appendChild(plot);panels.appendChild(figure);draw(plot,series,spec,animate);
      });
      root.dataset.ready="true";previousWidth=root.clientWidth;
    }
    select.addEventListener("change",()=>{state.segment=select.value;clearTip();render(true);save();live.textContent="已切换到"+data.series.find(s=>s.id===state.segment).label;});
    root.addEventListener("keydown",e=>{if(e.key==="Escape")clearTip();});
    if(window.ResizeObserver)new ResizeObserver(()=>{if(root.clientWidth&&root.clientWidth!==previousWidth){clearTip();render(false);}}).observe(root);
    render(false);
  })();
  </script>
</div>
</main></body></html>
