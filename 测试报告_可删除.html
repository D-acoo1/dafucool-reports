<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>测试报告 · 可随时删除</title>
<style>
  body {
    margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: rgba(255,255,255,0.12); backdrop-filter: blur(20px);
    border-radius: 20px; padding: 48px 56px; max-width: 680px; width: 100%;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: 1px; }
  .sub { font-size: 14px; opacity: 0.8; margin-bottom: 32px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 28px 0; }
  .stat {
    background: rgba(255,255,255,0.1); padding: 20px; border-radius: 14px;
    text-align: center; border: 1px solid rgba(255,255,255,0.15);
  }
  .stat .num { font-size: 32px; font-weight: 700; line-height: 1; }
  .stat .label { font-size: 12px; opacity: 0.75; margin-top: 6px; }
  .bars { margin: 24px 0; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 13px; }
  .bar-label { width: 80px; opacity: 0.9; }
  .bar-outer { flex: 1; background: rgba(255,255,255,0.1); height: 12px; border-radius: 6px; overflow: hidden; }
  .bar-inner {
    height: 100%; background: linear-gradient(90deg, #ffd89b, #ff7e5f);
    border-radius: 6px; transition: width 1.2s ease;
  }
  .bar-val { width: 44px; text-align: right; font-weight: 600; }
  .footer {
    margin-top: 32px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.15);
    font-size: 13px; opacity: 0.8; line-height: 1.6;
  }
  .footer b { color: #ffd89b; }
</style>
</head>
<body>
<div class="card">
  <h1>🧪 测试报告</h1>
  <div class="sub">本报告仅用于测试云端删除功能，可随时删除</div>

  <div class="stats">
    <div class="stat"><div class="num">42</div><div class="label">活跃用户</div></div>
    <div class="stat"><div class="num">78%</div><div class="label">留存率</div></div>
    <div class="stat"><div class="num">3.2k</div><div class="label">总访问量</div></div>
  </div>

  <div class="bars">
    <div class="bar-row">
      <div class="bar-label">周一</div>
      <div class="bar-outer"><div class="bar-inner" style="width: 62%"></div></div>
      <div class="bar-val">620</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">周二</div>
      <div class="bar-outer"><div class="bar-inner" style="width: 78%"></div></div>
      <div class="bar-val">780</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">周三</div>
      <div class="bar-outer"><div class="bar-inner" style="width: 55%"></div></div>
      <div class="bar-val">550</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">周四</div>
      <div class="bar-outer"><div class="bar-inner" style="width: 91%"></div></div>
      <div class="bar-val">910</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">周五</div>
      <div class="bar-outer"><div class="bar-inner" style="width: 100%"></div></div>
      <div class="bar-val">1020</div>
    </div>
  </div>

  <div class="footer">
    <b>👉 测试用途：</b>配好 GitHub 钥匙后，在云端目录里点这份报告旁的 🗑 按钮，
    应该能看到它"啪"地从列表消失，再刷新 GitHub 仓库也确实没了。<br>
    确认删除功能正常后，这份测试报告就完成使命了。
  </div>
</div>
</body>
</html>
